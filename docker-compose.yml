services:

  api:
    image: pdf-toc-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdf-toc-api
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: pdf-toc
      ALLOW_INLINE_FALLBACK: "false"
      EICAS_OCR_ENABLED: "true"
      OCR_LANGUAGE: eng
      OCR_DPI: "220"
      TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    image: pdf-toc-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdf-toc-worker
    command: ["python", "-m", "app.workers.run_worker", "--url", "redis://redis:6379/0", "--queue", "pdf-toc"]
    environment:
      REDIS_URL: redis://cmtdigi.com:6379/0
      QUEUE_NAME: pdf-toc
      ALLOW_INLINE_FALLBACK: "false"
      EICAS_OCR_ENABLED: "true"
      OCR_LANGUAGE: eng
      OCR_DPI: "220"
      TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
    volumes:
      - ./data:/app/data
    restart: unless-stopped


  frontend:
    image: pdf-toc-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://cmtdigi.com:8010}
    container_name: pdf-toc-frontend
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
