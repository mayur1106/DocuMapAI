services:

  api:
    image: pdf-toc-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdf-toc-api
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: pdf-toc
      ALLOW_INLINE_FALLBACK: "false"
      EICAS_OCR_ENABLED: "true"
      OCR_LANGUAGE: eng
      OCR_DPI: "220"
      TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
    ports:
      - "${API_PORT:-8010}:8010"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: pdf-toc-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pdf-toc-worker
    command: ["python", "-m", "app.workers.run_worker", "--url", "redis://redis:6379/0", "--queue", "pdf-toc"]
    environment:
      REDIS_URL: redis://redis:6379/0
      QUEUE_NAME: pdf-toc
      ALLOW_INLINE_FALLBACK: "false"
      EICAS_OCR_ENABLED: "true"
      OCR_LANGUAGE: eng
      OCR_DPI: "220"
      TESSDATA_DIR: /usr/share/tesseract-ocr/5/tessdata
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pdf-toc-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    image: pdf-toc-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://cmtdigi.com:8010}
    container_name: pdf-toc-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
